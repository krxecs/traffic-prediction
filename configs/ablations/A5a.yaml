model:
  ablation: A5a
experiment:
  graph_mode: adaptive
  use_daily_lag: false
  use_weekly_lag: false
  temporal_mode: multiscale
  adaptive_embed_dim: 16
  adaptive_top_k: 16
  physical_graph_alpha: 0.8
  adaptive_edge_dropout: 0.05
trainer:
  max_epochs: 150
  gradient_clip_val: 4.879639408647977
  callbacks:
  - class_path: src.lightning_train.NamedCheckpoint
    init_args:
      filename: best
      monitor: val_total_loss
      mode: min
      save_top_k: 1
      save_last: true
      auto_insert_metric_name: false
      enable_version_counter: false
  - class_path: src.lightning_train.NamedCheckpoint
    init_args:
      filename: best-mae
      monitor: val_mae
      mode: min
      save_top_k: 1
      save_last: false
      auto_insert_metric_name: false
      enable_version_counter: false
  - class_path: src.lightning_train.NamedCheckpoint
    init_args:
      filename: best-auprc
      monitor: val_auprc
      mode: max
      save_top_k: 1
      save_last: false
      auto_insert_metric_name: false
      enable_version_counter: false
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val_total_loss
      mode: min
      patience: 15
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0005105903209394755
    weight_decay: 1.2087541473056965e-06
lr_scheduler:
  class_path: src.lightning_train.WarmupCosine
  init_args:
    min_learning_rate: 1.0e-05
    warmup_epochs: 5
