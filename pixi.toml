[workspace]
authors = ["krxecs <183095628+krxecs@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "traffic-prediction"
version = "0.1.0"
platforms = [
  # The CUDA platform is listed first, so it wins platform selection on a machine with a CUDA driver.
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
  { name = "linux-64-cpu", platform = "linux-64" },
]

[tasks]
"main.py" = "python main.py"

[dependencies]
python = "3.12.*"
numpy = ">=2.5.1,<3"
matplotlib = ">=3.11.1,<4"
pytorch = ">=2.13.0,<3"
pytables = ">=3.11.1,<4"
ipykernel = ">=7.3.0,<8"
pandas = ">=3.0.5,<4"
ruff = ">=0.16.2,<0.17"
tqdm = ">=4.70.0,<5"
pytorch_geometric = ">=2.7.0,<3"
scikit-learn = ">=1.9.1,<2"
ipywidgets = ">=8.1.9,<9"
jupyter = ">=1.1.1,<2"
lightning = "2.6.6.*"
optuna = "4.9.0.*"
optuna-integration = "4.9.0.*"
jsonargparse = ">=4.40,<5"
pyyaml = ">=6.0.3,<7"
docstring_parser = ">=0.17"
typeshed-client = ">=2.8.2"

[pypi-dependencies]
modal = "==1.6.3"
